<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход — VMERU</title>
    
    <link rel="stylesheet" href="./assets/main-D2vPtxFg.css">
  </head>
  <body class="page-registration">
    <main class="registration-page">
      
<section class="registration registration--login" aria-labelledby="login-title">
  <h1 id="login-title">ВОЙТИ В АККАУНТ</h1>
  <form class="registration__form">
    <label class="visually-hidden" for="login-email">Email</label>
    <input id="login-email" type="email" name="email" placeholder="Email" autocomplete="email" required="required"/>
    <label class="visually-hidden" for="login-password">Пароль</label>
    <input id="login-password" type="password" name="password" placeholder="Пароль" autocomplete="current-password" required="required"/>
    <p class="registration__login">Нет аккаунта? <a href="./registration.html">Создать аккаунт</a></p>
    <button class="registration__submit" type="submit"><span>ПРОДОЛЖИТЬ</span><span class="registration__submit-arrow" aria-hidden="true"><img class="registration__divider" src="./images/registration-divider.svg" alt=""/><img class="registration__arrow" src="./images/registration-arrow.svg" alt=""/></span></button>
    <p class="registration__status" role="status" aria-live="polite"></p>
  </form>
</section>
    </main>
    <script defer src="./assets/main-Bl5wM9lx.js"></script>
  </body>
</html>
